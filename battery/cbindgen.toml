include_guard = "battery_ffi_h"
autogen_warning = "/* Generated by cbindgen. Do not edit. */"
include_version = true
language = "C"
cpp_compat = true
usize_is_size_t = true

[parse]
parse_deps = true
include = ["co3", "rust-spec"]
exported_only = true

[parse.expand]
crates = ["battery"]
features = ["export"]
normalize_abi = true
bootstrap = true

[struct]
rename_associated_constant = "UpperCase"

[enum]
prefix_with_name = true

[export.rename]
CBoxc_char = "CString"
CSliceMutu8 = "StrMut"
CState = "State"
CTechnology = "Technology"
